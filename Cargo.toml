[package]
name = "ripgsed"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A GNU sed 4.9 compatible stream editor, as a library and as a command"
repository = "https://github.com/small-gear-lab/ripgsed"
readme = "README.md"
keywords = ["sed", "regex", "text", "stream-editor", "cli"]
categories = ["command-line-utilities", "text-processing"]
# The fixtures of the tests are tens of megabytes: they stay in the repository.
include = ["/src", "/tests/public_api.rs", "/README.md", "/LICENSE-*", "/NOTICE", "/docs/*.md"]
authors = ["marie-222 <289302950+marie-222@users.noreply.github.com>"]

[dependencies]
# PCRE2 for `-P`: the bindings build the C library that they carry (or use the one of the system).
pcre2-sys = "0.2.10"
