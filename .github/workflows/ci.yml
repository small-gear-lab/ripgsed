name: ci

on:
  push:
    branches: [main, "research/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The debug build is slow: one fixture starts sed about 240 times.
      RIPGSED_FIXTURE_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v7
      # Fixtures of the locale items (LOC-007 and later) make locales with localedef from the
      # definitions in /usr/share/i18n, so the `locales` package must be there.
      - name: Locale definitions and localedef
        run: sudo apt-get update && sudo apt-get install -y locales
      - name: Toolchain
        run: rustup toolchain install 1.85 --profile minimal && rustup default 1.85
      # The runner starts jobs with SIGPIPE ignored; the fixtures expect the default.
      - run: python3 -c 'import os,signal,sys; signal.signal(signal.SIGPIPE, signal.SIG_DFL); os.execvp(sys.argv[1], sys.argv[1:])' cargo test
      - name: Compatibility summary
        run: tools/compat-summary.sh

  # Not tested by the fixtures (they need GNU sed and the locales of glibc): only that it builds and that
  # the tests of the program itself pass. The locale is then C or UTF-8 by name (src/locale.rs).
  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      # Without the fixture whose file names are not UTF-8, which macOS cannot create.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/tests/fixtures/iof-011-script-argument-not-utf8/
          sparse-checkout-cone-mode: false
      - name: Toolchain
        run: rustup toolchain install 1.85 --profile minimal && rustup default 1.85
      # The commands of the fixtures use the tools of GNU (od, tr, sort, mktemp ...), not those of BSD.
      - name: GNU tools
        run: brew install coreutils findutils gawk diffutils grep
      - run: cargo build
      - run: cargo test --lib --test cli --test public_api
      # The fixtures hold the results of GNU sed and GNU grep, and their commands use GNU tools.
      - name: Fixtures (what passes here is what is shown)
        continue-on-error: true
        run: |
          export RIPGSED_EXTRA_PATH="$(brew --prefix)/opt/coreutils/libexec/gnubin:$(brew --prefix)/opt/findutils/libexec/gnubin:$(brew --prefix)/opt/gawk/libexec/gnubin:$(brew --prefix)/opt/diffutils/libexec/gnubin:$(brew --prefix)/opt/grep/libexec/gnubin"
          RIPGSED_SHOW_FAILURES=1 cargo test --test differential fixtures_match -- --nocapture > fixtures.log 2>&1 || true
          sed -n '/^fixtures: /p' fixtures.log
          echo "--- the names of the fixtures that fail:"
          sed -n '/^[a-z][a-z0-9]*-[a-z0-9-]*$/p' fixtures.log | sort -u | sed 's/-.*//' | sort | uniq -c
          echo "--- the first ones:"
          sed -n '/^[a-z][a-z0-9]*-[a-z0-9-]*$/p' fixtures.log | sort -u | sed -n '1,60p'
      - name: The failures that are not about locales or /dev/full
        continue-on-error: true
        run: |
          export RIPGSED_EXTRA_PATH="$(brew --prefix)/opt/coreutils/libexec/gnubin:$(brew --prefix)/opt/findutils/libexec/gnubin:$(brew --prefix)/opt/diffutils/libexec/gnubin:$(brew --prefix)/opt/grep/libexec/gnubin"
          RIPGSED_FIXTURES=cmd-020-r-dev-stdin-every,cmd-062-probe-utils-fp-name,cmd-063-probe-resize-buffer,grep-bin-encoding-errors,iof-006-e-command-status-and-stdin,iof-012-r-read-error,opt-014-follow-symlinks-loop-after-line-skip,opt-014-follow-symlinks-loops-and-limit,pcre-utf8-locale RIPGSED_SHOW_FAILURES=1 cargo test --test differential fixtures_match -- --nocapture 2>&1 | cut -c1-400 | sed -n '/^fixture failures/,$p' | sed -n '1,120p'

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Fixtures of the locale items (LOC-007 and later) make locales with localedef from the
      # definitions in /usr/share/i18n, so the `locales` package must be there.
      - name: Locale definitions and localedef
        run: sudo apt-get update && sudo apt-get install -y locales
      - name: The reference sed must be GNU sed 4.9
        run: sed --version | sed -n '1p'
      - name: Regenerate the expected results
        run: ls tests/fixtures | python3 -c 'import os,signal,sys; signal.signal(signal.SIGPIPE, signal.SIG_DFL); os.execvp(sys.argv[1], sys.argv[1:])' xargs tools/gen-fixtures.sh > /dev/null
      - name: Expected results must be up to date
        run: git diff --exit-code -- tests/fixtures tests/reference.json tests/reference-grep.json
