name: probe

# A throw-away check (run by hand): does GNU sed misbehave in GB18030 under `I` on the glibc of this runner?
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y locales valgrind
      - name: Versions
        run: |
          ldd --version | sed -n '1p'
          sed --version | sed -n '1p'
          valgrind --version
      - name: A GB18030 locale
        run: |
          mkdir -p "$HOME/loc"
          localedef -f GB18030 -i zh_CN "$HOME/loc/zh_CN.GB18030"
      - name: The same input 40 times
        run: |
          export LOCPATH=$HOME/loc LC_ALL=zh_CN.GB18030
          for pat in 's/[a-z]/X/gI' 's/[^0-9]/X/gI'; do
            for text in 'a\xa8\xa1b' 'xx \xa8\xa5 yy' '\xa8\xa1\xa8\xa2\xa8\xa3' 'zz\xa8\xbf9'; do
              n=$(for i in $(seq 1 40); do printf "$text\n" | sed "$pat" | od -An -c | tr -d ' \n'; echo; done | sort -u | wc -l)
              echo "distinct outputs in 40 runs: $n   text=$text   $pat"
            done
          done
      - name: valgrind
        run: |
          export LOCPATH=$HOME/loc LC_ALL=zh_CN.GB18030
          printf 'a\xa8\xa1b\n' | valgrind --track-origins=yes --error-exitcode=9 sed 's/[a-z]/X/gI' 2>&1 >/dev/null | sed -n '/Conditional\|Use of uninit\|Invalid\|ERROR SUMMARY\|at 0x\|by 0x/p' | sed -n '1,24p'
