name: release

# Publishes the crate to crates.io when a tag `vX.Y.Z` is pushed, with a short-lived token that
# crates.io gives to this workflow (Trusted Publishing: no token is stored in the repository).
# On crates.io, the crate has this repository, this workflow file and the environment `release`
# set as its trusted publisher (crates.io/crates/ripgsed/settings).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # the GitHub release
      id-token: write   # the token of crates.io
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The tag must be on main and name the version of the crate
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | sed -n '1p')
          test "v$version" = "$GITHUB_REF_NAME"
      # Before the publication: a version without notes must not be published.
      - name: The notes of this version in CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{ if (found) exit; found = ($2 == v) } found' CHANGELOG.md | sed '1d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
      - name: Toolchain
        run: rustup toolchain install 1.85 --profile minimal && rustup default 1.85
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth
      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --title "ripgsed ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}
